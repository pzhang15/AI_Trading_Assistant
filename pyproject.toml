[project]
name = "trade-guardian"
version = "0.1.0"
description = "Trade Guardian - a FastAPI service scaffold for AI-driven trading research (no execution yet)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "celery>=5.4.0",
  "redis>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/trade-guardian"
Issues = "https://github.com/your-org/trade-guardian/issues"

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "black>=24.8.0",
  "mypy>=1.11.0",
  "pre-commit>=4.0.0",
  "detect-secrets>=1.5.0",
  "types-redis>=4.6.0.20241004",
]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "N", "UP", "B"]
lint.ignore = ["E501"]  # handled by Black
exclude = ["src/trade_guardian/db/migrations"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
exclude = ["src/trade_guardian/db/migrations"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]


